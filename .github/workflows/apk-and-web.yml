name: Build APK and web

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apk-and-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - uses: actions/upload-artifact@v4
        with:
          name: tilde-web
          path: dist-web

  deploy-pages:
    needs: web
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - name: Restore the signing key from secrets
        env:
          TILDE_KEYSTORE: ${{ secrets.TILDE_KEYSTORE }}
          TILDE_KEY_PASSWORD: ${{ secrets.TILDE_KEY_PASSWORD }}
        run: |
          if [ -z "$TILDE_KEYSTORE" ] || [ -z "$TILDE_KEY_PASSWORD" ]; then
            echo "::error::Add the TILDE_KEYSTORE and TILDE_KEY_PASSWORD secrets (repo Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$TILDE_KEYSTORE" | base64 -d > android/tilde-release.p12
      - name: Assemble signed release APK
        working-directory: android
        env:
          TILDE_KEY_PASSWORD: ${{ secrets.TILDE_KEY_PASSWORD }}
          TILDE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk tilde.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tilde-apk
          path: tilde.apk
      - name: Publish to the "latest" release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tilde (latest build)
          body: Tilde build ${{ github.run_number }} (${{ github.sha }}). Installs as an update over earlier builds signed with the Tilde key.
          prerelease: true
          files: tilde.apk
