name: Build APK and web

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apk-and-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - uses: actions/upload-artifact@v4
        with:
          name: tilde-web
          path: dist-web

  deploy-pages:
    needs: web
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk tilde.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tilde-apk
          path: tilde.apk
      - name: Publish to the "latest" release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Tilde (latest build)
          body: Debug-signed APK built from ${{ github.sha }}. Install on Android after allowing installs from unknown sources.
          prerelease: true
          files: tilde.apk
